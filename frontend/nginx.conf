# Detrás de Caddy el protocolo original (https) llega en X-Forwarded-Proto; sin Caddy es el propio.
map $http_x_forwarded_proto $protocolo_cliente {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Detrás de Caddy (producción), la IP real del cliente llega en X-Forwarded-For desde la red
  # interna de Docker. Solo se confía en direcciones privadas, así nadie la puede falsificar
  # desde afuera; sin Caddy (desarrollo) $remote_addr ya es el cliente.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  # Igual que el límite de la API (spring.servlet.multipart: 16 MB por solicitud).
  client_max_body_size 16m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $protocolo_cliente;
    proxy_read_timeout 60s;
  }

  # Solo la salud es pública (para el balanceador o un monitor externo); el resto de actuator
  # (métricas, información) queda dentro de la red de Docker.
  location = /actuator/health {
    proxy_pass http://api:8080;
  }

  location /actuator/health/ {
    proxy_pass http://api:8080;
  }

  location /actuator/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|ico|png|svg|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
