services:
  mysql:
    image: mysql:8.4.11
    command:
      - --log-bin-trust-function-creators=1
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-inmobiliaria_db}
      MYSQL_USER: ${DB_USER:-inmobiliaria}
      MYSQL_PASSWORD: ${DB_PASSWORD:-NexoraDevMysql2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-NexoraDevRoot2026}
      MYSQL_MIGRATOR_USER: ${MYSQL_MIGRATOR_USER:-nexora_migrator}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:-NexoraDevMigrator2026}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - inmobiliaria_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mongodb:
    image: mongo:8.0.32
    restart: unless-stopped

    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 > /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        chown mongodb:mongodb /etc/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-nexora_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-NexoraDevMongoRoot2026}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-nexora}
      MONGO_APP_DATABASE: ${MONGO_DATABASE:-nexora}
      MONGO_APP_USER: ${MONGO_APP_USER:-nexora_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-NexoraDevMongoApp2026}
      MONGO_MIGRATOR_USER: ${MONGO_MIGRATOR_USER:-nexora_migrator}
      MONGO_MIGRATOR_PASSWORD: ${MONGO_MIGRATOR_PASSWORD:-NexoraDevMongoMigrator2026}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - inmobiliaria_mongodb_data:/data/db
      - ./docker/mongodb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "try { rs.status(); } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); }
          quit(db.hello().isWritablePrimary ? 0 : 1);"
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  redis:
    image: redis:8.2.10-alpine3.22
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-NexoraDevRedis2026}
      TZ: America/Bogota
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - inmobiliaria_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  relational-migrator:
    profiles: ["migration"]
    build:
      context: .
      dockerfile: docker/relational-migrator/Dockerfile
      args:
        MYSQL_CONNECTOR_VERSION: ${MYSQL_CONNECTOR_VERSION:-8.3.0}
    image: nexora/relational-migrator:local
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      MIGRATOR_APP_TELEMETRY_ENABLE: ${MIGRATOR_TELEMETRY_ENABLED:-false}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:${MIGRATOR_PORT:-8278}:8080"
    volumes:
      - inmobiliaria_migrator_data:/root/Migrator

  api:
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 35s
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-inmobiliaria_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
      DB_USER: ${DB_USER:-inmobiliaria}
      DB_PASSWORD: ${DB_PASSWORD:-NexoraDevMysql2026}
      MONGODB_URI: mongodb://${MONGO_APP_USER:-nexora_app}:${MONGO_APP_PASSWORD:-NexoraDevMongoApp2026}@mongodb:27017/${MONGO_DATABASE:-nexora}?authSource=${MONGO_DATABASE:-nexora}&replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-NexoraDevRedis2026}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-10m}
      CACHE_KEY_PREFIX: ${CACHE_KEY_PREFIX:-nexora:}
      JWT_SECRET: ${JWT_SECRET:-nexora-dev-jwt-secret-2026-change-me}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:4200}
      APP_STORAGE_PATH: /app/storage
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_EMPRESA_CODIGO: ${BOOTSTRAP_EMPRESA_CODIGO:-EMP001}
      BOOTSTRAP_EMPRESA_NOMBRE: ${BOOTSTRAP_EMPRESA_NOMBRE:-NEXORA DEMO}
      BOOTSTRAP_EMPRESA_NIT: ${BOOTSTRAP_EMPRESA_NIT:-900000001}
      BOOTSTRAP_ADMIN_DOCUMENTO: ${BOOTSTRAP_ADMIN_DOCUMENTO:-1000000001}
      BOOTSTRAP_ADMIN_NOMBRES: ${BOOTSTRAP_ADMIN_NOMBRES:-Administrador}
      BOOTSTRAP_ADMIN_APELLIDOS: ${BOOTSTRAP_ADMIN_APELLIDOS:-NEXORA}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-SUPERADMIN}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@nexora.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-NexoraDemo2026!}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - inmobiliaria_documentos:/app/storage
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://localhost:8080/actuator/health/readiness
          | grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:80"

volumes:
  inmobiliaria_mysql_data:
  inmobiliaria_mongodb_data:
  inmobiliaria_redis_data:
  inmobiliaria_migrator_data:
  inmobiliaria_documentos:
