name: Prueba de humo E2E

# Levanta el stack completo con docker compose (MySQL, MongoDB rs0, Redis, API y frontend)
# y recorre la aplicación de punta a punta con scripts/prueba-humo.sh. Dos variantes:
# - desarrollo: compose.yaml, como en el computador del equipo;
# - producción: compose.prod.yaml con Caddy y HTTPS (DOMINIO=localhost), la misma configuración
#   que corre en AWS, más el monitoreo y un ciclo completo de respaldo y restauración.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  humo:
    name: Humo E2E (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Variables de prueba (no son las del servidor)
        run: |
          cat > .env <<'VARS'
          DB_PASSWORD=HumoMysql2026x
          DB_ROOT_PASSWORD=HumoRoot2026x
          MYSQL_MIGRATOR_PASSWORD=HumoMigrator2026x
          MONGO_ROOT_PASSWORD=HumoMongoRoot2026x
          MONGO_APP_PASSWORD=HumoMongoApp2026x
          MONGO_MIGRATOR_PASSWORD=HumoMongoMigrator2026x
          REDIS_PASSWORD=HumoRedis2026x
          JWT_SECRET=humo-jwt-secret-de-prueba-con-mas-de-32-caracteres
          BOOTSTRAP_ADMIN_PASSWORD=HumoAdmin2026!
          VARS

      - name: Construir y levantar el stack
        run: |
          docker compose up -d --build --wait --wait-timeout 900 || {
            docker compose ps -a --format '{{.Service}}: {{.Status}}' | grep -v '(healthy)' \
              | while IFS= read -r l; do echo "::error title=Servicio sin arrancar::$l"; done
            for s in $(docker compose ps -a --format '{{.Service}} {{.Status}}' | grep -v '(healthy)' | cut -d' ' -f1); do
              docker compose logs --no-color --tail 15 "$s" | tail -5 \
                | while IFS= read -r l; do echo "::warning title=Log de $s::${l:0:900}"; done
            done
            exit 1
          }

      - name: Prueba de humo
        env:
          BASE_URL: http://localhost:4200
          ADMIN_USUARIO: SUPERADMIN
          ADMIN_PASSWORD: HumoAdmin2026!
          ADMIN_PASSWORD_NUEVA: HumoAdminNueva2026!
          COMPOSE: "1"
        run: bash scripts/prueba-humo.sh

      # Datos de ejemplo para que las capturas muestren tablas y tableros con contenido
      # (proyectos, lotes, prospectos, oportunidades, reservas, tareas y PQRS).
      - uses: grafana/setup-k6-action@v1
      - name: Datos de ejemplo para las capturas
        continue-on-error: true
        env:
          BASE_URL: http://localhost:4200
          ADMIN_USUARIO: SUPERADMIN
          ADMIN_PASSWORD: HumoAdminNueva2026!
          CARGA_PASSWORD: CargaPrueba2026!
          VOLUMEN: pequeno
        run: k6 run --quiet -e VUS=4 carga/semilla.js 2>&1 | tail -15

      # Capturas de las pantallas principales (escritorio y celular) para revisar el diseño en el
      # PR sin levantar nada: quedan en el artefacto "capturas". No bloquea el PR.
      - name: Capturas de pantalla
        continue-on-error: true
        env:
          BASE_URL: http://localhost:4200
          USUARIO: SUPERADMIN
          PASSWORD: HumoAdminNueva2026!
          CAPTURAS_JPG: "1"
        run: |
          npm install --no-save --no-package-lock --prefix . playwright@1.56.1 > /dev/null
          npx --prefix . playwright install --with-deps chromium > /dev/null
          node scripts/capturas.mjs
          if [[ "$(cat capturas/errores.txt)" != "Sin errores" ]]; then
            head -20 capturas/errores.txt | while IFS= read -r l; do echo "::warning title=Navegador::${l:0:900}"; done
          fi
          # Versión liviana en el log (una línea por imagen, en base64) para revisarlas sin
          # descargar el artefacto.
          echo "::group::Capturas en base64"
          for f in capturas/jpg/*.jpg; do echo "CAPTURA $(basename "$f") $(base64 -w0 "$f")"; done
          echo "::endgroup::"

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas/
          if-no-files-found: ignore
          retention-days: 14

      - name: Estado y registros
        if: always()
        run: |
          docker compose ps
          echo "::group::API"
          docker compose logs --no-color api | tail -400
          echo "::endgroup::"
          echo "::group::Líneas WARN y ERROR de la API"
          docker compose logs --no-color api | grep -E ' (WARN|ERROR) ' | tail -100 || true
          echo "::endgroup::"
          echo "::group::MongoDB"
          docker compose logs --no-color mongodb | tail -60
          echo "::endgroup::"

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  humo-produccion:
    name: Humo E2E (compose.prod con HTTPS y monitoreo)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPOSE_FILE: compose.prod.yaml:compose.monitoring.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Variables de prueba (no son las del servidor)
        run: |
          cat > .env <<'VARS'
          DOMINIO=localhost
          ACME_EMAIL=ci@ejemplo.com
          DB_PASSWORD=HumoMysql2026x
          DB_ROOT_PASSWORD=HumoRoot2026x
          MYSQL_MIGRATOR_PASSWORD=HumoMigrator2026x
          MONGO_ROOT_PASSWORD=HumoMongoRoot2026x
          MONGO_APP_PASSWORD=HumoMongoApp2026x
          MONGO_MIGRATOR_PASSWORD=HumoMongoMigrator2026x
          REDIS_PASSWORD=HumoRedis2026x
          JWT_SECRET=humo-jwt-secret-de-prueba-con-mas-de-32-caracteres
          BOOTSTRAP_ADMIN_ENABLED=true
          BOOTSTRAP_EMPRESA_CODIGO=EYC-ALTAMAR
          BOOTSTRAP_EMPRESA_NOMBRE=E&C Altamar Constructora
          BOOTSTRAP_EMPRESA_NIT=900000002
          BOOTSTRAP_ADMIN_DOCUMENTO=1000000002
          BOOTSTRAP_ADMIN_NOMBRES=Administrador
          BOOTSTRAP_ADMIN_APELLIDOS=NEXORA
          BOOTSTRAP_ADMIN_USERNAME=SUPERADMIN
          BOOTSTRAP_ADMIN_EMAIL=admin@ejemplo.com
          BOOTSTRAP_ADMIN_PASSWORD=HumoAdmin2026!
          MYSQL_EXPORTER_PASSWORD=HumoExporter2026x
          GRAFANA_ADMIN_PASSWORD=HumoGrafana2026x
          VARS

      - name: Sin contraseñas por defecto (compose se niega a arrancar)
        run: |
          if env -i PATH="$PATH" docker compose -f compose.prod.yaml --env-file /dev/null config > /dev/null 2>&1; then
            echo "::error::compose.prod.yaml arrancaría sin contraseñas"; exit 1
          fi
          echo "compose.prod.yaml exige las contraseñas"

      - name: Respaldos instalados como en el servidor (carpetas y cron, sin S3)
        run: bash deploy/instalar-respaldos.sh

      - name: Construir y levantar el stack de producción
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: Prueba de humo por HTTPS
        env:
          BASE_URL: https://localhost
          CURL_INSECURE: "1"
          ADMIN_USUARIO: SUPERADMIN
          ADMIN_PASSWORD: HumoAdmin2026!
          ADMIN_PASSWORD_NUEVA: HumoAdminNueva2026!
          COMPOSE: "1"
        run: bash scripts/prueba-humo.sh

      - name: Monitoreo (Prometheus y Grafana)
        run: |
          set -e
          for i in $(seq 60); do
            abajo="$(curl -s http://127.0.0.1:9090/api/v1/targets | jq -r '.data.activeTargets[] | select(.health != "up") | "\(.labels.job): \(.lastError)"')"
            [ -z "$abajo" ] && break
            sleep 2
          done
          [ -z "$abajo" ] || { echo "::error::Objetivos de Prometheus caídos: $abajo"; exit 1; }
          echo "Todos los objetivos de Prometheus arriba"
          sleep 15
          for q in 'nexora_sync_retraso_seconds_count' 'nexora_crm_pendientes' 'hikaricp_connections_max' \
                   'mongodb_driver_pool_size' 'tomcat_threads_config_max_threads' 'http_server_requests_seconds_bucket' \
                   'mysql_up == 1' 'mongodb_up == 1' 'redis_up == 1' 'node_cpu_seconds_total' \
                   'container_cpu_usage_seconds_total{name=~"nexora-.+"}'; do
            n="$(curl -s --get http://127.0.0.1:9090/api/v1/query --data-urlencode "query=count($q)" | jq -r '.data.result[0].value[1] // "0"')"
            [ "$n" != 0 ] || { echo "::error::Prometheus no tiene datos de $q"; exit 1; }
            echo "  $q: $n series"
          done
          curl -sf -u admin:HumoGrafana2026x http://127.0.0.1:3000/api/health
          curl -sf -u admin:HumoGrafana2026x 'http://127.0.0.1:3000/api/search?query=NEXORA' | jq -e 'length >= 1' > /dev/null \
            || { echo "::error::Grafana no tiene el tablero de NEXORA"; exit 1; }
          echo "Grafana arriba con el tablero de NEXORA"

      - name: Ningún contenedor se reinició
        run: |
          reinicios="$(docker compose ps -aq | xargs docker inspect -f '{{.Name}} {{.RestartCount}}' | awk '$2 > 0')"
          if [ -n "$reinicios" ]; then echo "::error::Contenedores reiniciados en el arranque: $reinicios"; exit 1; fi
          echo "Ningún contenedor se reinició"

      - name: Puertos y endpoints cerrados
        run: |
          set -e
          publicados="$(docker compose ps --format '{{.Service}} {{.Publishers}}' | grep -v '^caddy' | grep -E '0\.0\.0\.0|::' || true)"
          if [ -n "$publicados" ]; then echo "::error::Servicios con puertos públicos: $publicados"; exit 1; fi
          for ruta in /actuator/env /actuator/info /actuator/prometheus; do
            codigo="$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost$ruta")"
            [ "$codigo" = 404 ] || { echo "::error::$ruta respondió $codigo"; exit 1; }
          done
          curl -skI https://localhost/ | grep -i '^strict-transport-security' || { echo "::error::Falta HSTS"; exit 1; }
          echo "Solo Caddy publica puertos; actuator cerrado; HSTS activo"

      - name: Respaldo, prueba de restauración y restauración
        run: |
          set -euo pipefail
          mq() { docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -N -s "$MYSQL_DATABASE" -e "$0"' "$1"; }
          mg() { docker compose exec -T mongodb sh -c 'mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin "$MONGO_APP_DATABASE" --eval "$0"' "$1" | tail -1; }
          mal() { echo "::error title=Respaldos::$*"; exit 1; }

          echo "::group::Respaldo"
          bash deploy/respaldar.sh
          r="$(find /var/lib/nexora/respaldos -mindepth 1 -maxdepth 1 -type d -name 'nexora-*' | sort | tail -1)"
          cat "$r/MANIFIESTO.txt"; ls -la "$r"
          grep -qx 'flyway=29' "$r/MANIFIESTO.txt" || mal "El manifiesto no dice flyway=29"
          echo "::endgroup::"

          echo "::group::Prueba de restauración (temporales, sin tocar los datos)"
          bash deploy/probar-restauracion.sh
          echo "::endgroup::"

          for m in nexora_respaldo_ultimo_exito_timestamp_seconds nexora_respaldo_prueba_ultimo_exito_timestamp_seconds; do
            n=0
            for _ in $(seq 30); do
              n="$(curl -s --get http://127.0.0.1:9090/api/v1/query --data-urlencode "query=count($m)" | jq -r '.data.result[0].value[1] // "0"')"
              [ "$n" = 1 ] && break; sleep 2
            done
            [ "$n" = 1 ] || mal "Prometheus no tiene $m"
            echo "Prometheus tiene $m"
          done

          echo "::group::Daño a propósito después del respaldo"
          empresa="$(mq "SELECT nombre FROM empresas WHERE codigo = 'EYC-ALTAMAR'")"
          tareas="$(mg 'db.tareas.countDocuments()')"
          [ "$tareas" -ge 1 ] || mal "No hay tareas para probar la restauración"
          mq "UPDATE empresas SET nombre = 'EMPRESA DANADA' WHERE codigo = 'EYC-ALTAMAR'"
          mg 'db.tareas.deleteMany({}).deletedCount'
          docker compose exec -T api sh -c 'echo basura > /app/storage/despues-del-respaldo.txt'
          echo "Empresa '$empresa' renombrada, $tareas tareas borradas, un archivo nuevo"
          echo "::endgroup::"

          echo "::group::Restauración"
          bash deploy/restaurar.sh "$r" --confirmar
          echo "::endgroup::"

          [ "$(mq "SELECT nombre FROM empresas WHERE codigo = 'EYC-ALTAMAR'")" = "$empresa" ] || mal "MySQL no volvió al respaldo"
          [ "$(mg 'db.tareas.countDocuments()')" = "$tareas" ] || mal "MongoDB no volvió al respaldo"
          ! docker compose exec -T api test -e /app/storage/despues-del-respaldo.txt || mal "Los documentos no volvieron al respaldo"
          espejo=0
          for _ in $(seq 60); do
            espejo="$(mq 'SELECT COUNT(*) FROM lectura_tareas')"
            [ "$espejo" = "$tareas" ] && break; sleep 2
          done
          [ "$espejo" = "$tareas" ] || mal "lectura_tareas tiene $espejo filas y MongoDB $tareas tareas"
          # El Change Stream sigue vivo: un cambio nuevo en MongoDB llega al espejo.
          tarea="$(mg 'String(db.tareas.findOne({}, {_id: 1})._id)')"
          mg "db.tareas.updateOne({_id: $tarea}, {\$set: {estado: 'COMPLETADA'}}).modifiedCount"
          proyectado=""
          for _ in $(seq 60); do
            proyectado="$(mq "SELECT estado FROM lectura_tareas WHERE id = $tarea")"
            [ "$proyectado" = COMPLETADA ] && break; sleep 2
          done
          [ "$proyectado" = COMPLETADA ] || mal "Después de restaurar, el cambio de la tarea $tarea no llegó a lectura_tareas"
          [ "$(mg 'db.sync_tokens.countDocuments()')" -ge 1 ] || mal "El Change Stream no guardó su posición"
          codigo="$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/api/v1/auth/login \
            -H 'Content-Type: application/json' -d '{"identificador":"SUPERADMIN","password":"HumoAdminNueva2026!"}')"
          [ "$codigo" = 200 ] || mal "Después de restaurar el inicio de sesión respondió $codigo"
          ls /var/lib/nexora/respaldos
          echo "Restauración completa: MySQL, MongoDB, documentos, espejos y sesión como en el respaldo"

      - name: Estado y registros
        if: always()
        run: |
          docker compose ps
          echo "::group::API"
          docker compose logs --no-color api | tail -300
          echo "::endgroup::"
          echo "::group::Caddy"
          docker compose logs --no-color caddy | tail -80
          echo "::endgroup::"

      - name: Bajar el stack
        if: always()
        run: docker compose down -v
