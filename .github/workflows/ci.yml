name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar todas las pruebas
        run: mvn -B -ntp verify

      - name: Anotar en el PR las pruebas que fallan
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          def escapar(texto):
              return texto.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          for reporte in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              for caso in ET.parse(reporte).getroot().iter('testcase'):
                  for tipo in ('failure', 'error'):
                      falla = caso.find(tipo)
                      if falla is None:
                          continue
                      titulo = f"{caso.get('classname')}.{caso.get('name')}"
                      detalle = (falla.get('message') or '') + '\n' + (falla.text or '')[:2000]
                      print(f"::error title={escapar(titulo)}::{escapar(detalle)}")
          PY

      - name: Guardar reportes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: target/surefire-reports/

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el frontend
        run: npm run build