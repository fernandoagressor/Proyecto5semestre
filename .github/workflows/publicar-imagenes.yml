name: Publicar imágenes

# Construye las imágenes de la API y del frontend y las publica en GitHub Container Registry:
# - cada merge a develop → etiquetas `develop` y `sha-<commit>` (y despliega a staging si la
#   variable del repositorio STAGING_AUTODEPLOY es "true");
# - cada tag vX.Y.Z → etiquetas `X.Y.Z` y `latest`.
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagen:
    name: Imagen ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - nombre: nexora-api
            contexto: .
          - nombre: nexora-frontend
            contexto: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.nombre }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,scope=${{ matrix.nombre }},mode=max

  staging:
    name: Desplegar a staging
    needs: imagen
    if: github.ref == 'refs/heads/develop' && vars.STAGING_AUTODEPLOY == 'true'
    uses: ./.github/workflows/desplegar.yml
    with:
      entorno: staging
      version: sha-${{ github.sha }}
      ref: ${{ github.sha }}
    secrets: inherit
