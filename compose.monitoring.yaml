# Monitoreo de NEXORA CORE: se suma a compose.prod.yaml.
#
#   docker compose -f compose.prod.yaml -f compose.monitoring.yaml up -d
#
# Prometheus guarda 15 días de métricas de la API, la máquina, los contenedores, MySQL, MongoDB
# y Redis; Grafana trae listo el tablero "NEXORA – Producción y pruebas de carga". Ninguno es
# público: escuchan solo en 127.0.0.1 del servidor y se abren con un túnel SSH
# (docs/DESPLIEGUE_AWS.md, sección Monitoreo).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    environment:
      # Lo usa docker/mysql/init/02-create-exporter-user.sh al crear la base.
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Defina MYSQL_EXPORTER_PASSWORD}

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 768m
    logging: *logging

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nexora.json
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
      - --disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: 192m
    logging: *logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging

  mongodb-exporter:
    image: percona/mongodb_exporter:0.43.1
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - --mongodb.uri=mongodb://${MONGO_ROOT_USER:-nexora_root}:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin?directConnection=true
      - --collect-all
      - --compatible-mode
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging

volumes:
  prometheus_data:
  grafana_data:
