# Prometheus de NEXORA CORE (compose.monitoring.yaml). Todo se lee dentro de la red de Docker.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: nexora-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
  - job_name: maquina
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: contenedores
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
  - job_name: mongodb
    static_configs:
      - targets: ["mongodb-exporter:9216"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
